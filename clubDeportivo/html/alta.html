<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alta de Socio - Club Deportivo</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="app-header">
        <div class="header-title">
            <h1>Club Deportivo</h1>
            <p>Registro de Nuevos Socios</p>
        </div>
        <div>
            <a href="../index.html" class="btn-secondary">← Volver al Listado</a>
        </div>
    </header>

    <main class="dashboard-container" style="max-width: 800px; margin: 0 auto;">
        <!-- 3.4 ALTA DE SOCIO -->
        <section class="card register-section">
            <h2>Alta de Nuevo Socio</h2>
            <form id="register-form" novalidate>
                <div class="form-row">
                    <div class="input-group">
                        <label for="reg-nombre">Nombre:</label>
                        <input type="text" id="reg-nombre" placeholder="Ej: María José">
                        <span class="field-error-text"></span>
                    </div>
                    <div class="input-group">
                        <label for="reg-apellidos">Apellidos:</label>
                        <input type="text" id="reg-apellidos" placeholder="Ej: Pérez Gómez">
                        <span class="field-error-text"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="reg-dni">DNI:</label>
                        <input type="text" id="reg-dni" placeholder="12345678Z">
                        <span class="field-error-text"></span>
                    </div>
                    <div class="input-group">
                        <label for="reg-email">Email:</label>
                        <input type="email" id="reg-email" placeholder="usuario@correo.es">
                        <span class="field-error-text"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="reg-telefono">Teléfono:</label>
                        <input type="text" id="reg-telefono" placeholder="612345678">
                        <span class="field-error-text"></span>
                    </div>
                    <div class="input-group">
                        <label for="reg-fnacimiento">Fecha Nacimiento (dd/mm/aaaa):</label>
                        <input type="text" id="reg-fnacimiento" placeholder="05/06/2000">
                        <span class="field-error-text"></span>
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 15px;">
                    <label>Actividades:</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="actividad" value="natacion"> Natación</label>
                        <label><input type="checkbox" name="actividad" value="yoga"> Yoga</label>
                        <label><input type="checkbox" name="actividad" value="padel"> Pádel</label>
                        <label><input type="checkbox" name="actividad" value="musculacion"> Musculación</label>
                        <label><input type="checkbox" name="actividad" value="spinning"> Spinning</label>
                        <label><input type="checkbox" name="actividad" value="pilates"> Pilates</label>
                    </div>
                    <span class="field-error-text"></span>
                </div>

                <div class="input-group">
                    <label for="reg-cuota">Cuota Mensual (€):</label>
                    <input type="number" id="reg-cuota" placeholder="35">
                </div>

                <button type="submit" class="btn-primary btn-block">Dar de Alta</button>
            </form>
            <div id="success-alert" class="success-alert hidden">Socio dado de alta correctamente.</div>
        </section>
    </main>

</body>
</html>
