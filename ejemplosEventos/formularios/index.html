<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
    <link rel="stylesheet" href="./styles/style.css">
    <script src="./js/main.js" defer ></script>
</head>
<body>

    <form id="form1">
        <label>Usuario: </label><input name="" id="login" ><br>
        <label>Constraseña: </label><input name="" type="password"><br>
        <a href="#" id="aForm1" >Enviar</a>

    </form>

    <form id="form2">
        <label>Categoria: </label>
        <select id="colores" multiple>
            <option value="" disabled selected>Elige opcion</option>
            <option value="red">Rojo</option>
            <option value="blue">Azul</option>
            <option value="violet">Violeta</option>
            <option value="orange">Naranja</option>
            <option value="yellow">Amarillo</option>
        </select>
        <label>Elige una opcion: </label>
        <br>
        <input type="radio" name="" value="">Tengo mas de 18
        <input type="radio" name="" value="">Tengo menos de 18

        <textarea name="" id="areaDeTexto"></textarea><br>

        <progress min="0" max="100" value="50"></progress><br>
        <meter min="0" max="100" value="50"></meter><br>
        <input type="range" name="" id="range1" min="0" max="100" value="50" step="10">
    </form>

    

    <p id="info"></p>
    
</body>
</html>
